<!doctype html>
<html><head><meta charset="utf-8"><script src="comun.js"></script></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// Día 77 · «Eso sí, para empezar es indispensable tener al menos una de tres condiciones. Uno …
// Dos … Y tres … Si tiene al menos una». Vuelve a la cara en «escríbale a Queswa».
const T0 = 68.3, FIN = 85.0;
const W = { una: 71.98, uno: 73.54, dos: 76.0, tres: 78.32, simon: 80.52, david: 82.02, si: 84.02 };
const svg = $('s'); montarDefs(svg);
const t1 = txt('Para empezar', { class: 'tit', x: 540, y: 300, 'text-anchor': 'middle' }, svg);
const t2 = txt('Al menos una de tres', { class: 'tit', x: 540, y: 300, 'text-anchor': 'middle' }, svg);
const F = [
  { n: '1', ic: 'contactos', a: 'Contactos', b: 'Conocer gente', y: 520, t: W.uno },
  { n: '2', ic: 'cambio', a: 'Deseo de un cambio', b: 'De vida', y: 770, t: W.dos },
  { n: '3', ic: 'grande', a: 'Ganas de algo grande', b: '', y: 1050, t: W.tres, h: 250 },
].map(f => {
  const h = f.h || 200, g = el('g', {}, svg);
  const card = el('rect', { x: -440, y: -h / 2, width: 880, height: h, rx: 28, fill: '#15171C', stroke: 'rgba(255,255,255,0.1)', 'stroke-width': 2 }, g);
  txt(f.n, { x: -395, y: -h / 2 + 52, style: 'font-family:RM;font-size:30px;fill:#64748B' }, g);
  el('use', { href: '#i-' + f.ic, x: -345, y: -55, width: 110, height: 110, fill: 'none', stroke: TIT, 'stroke-width': 1.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  const y0 = f.b ? -6 : -h / 2 + 95;
  txt(f.a, { class: 'fila', x: -190, y: y0 }, g);
  if (f.b) txt(f.b, { class: 'mono', x: -190, y: 46 }, g);
  const extra = [];
  if (f.n === '3') {
    extra.push(txt('Simón Borrero · Rappi', { class: 'mono', x: -190, y: 30 }, g));
    extra.push(txt('David Vélez · Nubank', { class: 'mono', x: -190, y: 80 }, g));
  }
  return { ...f, g, card, extra };
});

function pintar(tl) {
  const t = T0 + tl;
  fundido(t, T0, FIN);
  relevo(t1, t2, t, W.una);
  F.forEach((f, i) => {
    const v = cl((t - f.t + 0.15) / 0.35);
    pon(f.g, 540, f.y + lerp(30, 0, sale((t - f.t + 0.15) / 0.35)), 1, v);
    // «Si tiene al menos una»: cada tarjeta se enciende por turno.
    const u = (t - W.si - i * 0.3) / 0.6, luz = u > 0 && u < 1 ? Math.sin(Math.PI * u) : 0;
    f.card.setAttribute('stroke', luz > 0.05 ? `rgba(197,160,89,${(0.25 + 0.75 * luz).toFixed(2)})` : 'rgba(255,255,255,0.1)');
    f.card.setAttribute('stroke-width', 2 + 2 * luz);
  });
  F[2].extra[0].style.opacity = cl((t - W.simon) / 0.3);
  F[2].extra[1].style.opacity = cl((t - W.david) / 0.3);
}
window.pintar = pintar; window.DUR = FIN - T0; pintar(0);
</script></body></html>
